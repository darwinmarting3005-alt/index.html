<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti ❤️</title>
    <style>
        /* ESTILOS (El diseño visual) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            background-color: #ffe6e6; /* Fondo rosita suave */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #4a4a4a;
            overflow: hidden;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
            position: relative;
            overflow: hidden;
            transform: scale(0.95);
            animation: zoomIn 1s forwards;
        }

        @keyframes zoomIn {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        h1 {
            color: #ff4d6d;
            margin-bottom: 10px;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        p {
            line-height: 1.6;
            margin-bottom: 20px;
            font-size: 1.1rem;
            animation: fadeInText 1s ease-out;
        }

        @keyframes fadeInText {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Espacio para la foto */
        .photo-container {
            width: 150px;
            height: 150px;
            margin: 0 auto 20px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #ff4d6d;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            animation: fadeIn 1s ease-out;
        }

        /* El Corazón Latiendo */
        .heart {
            font-size: 50px;
            color: #ff4d6d;
            animation: latido 1s infinite;
            margin-bottom: 15px;
            display: inline-block;
        }

        @keyframes latido {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* Botón */
        button {
            background-color: #ff4d6d;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
            animation: fadeInText 1s ease-out;
        }

        button:hover {
            background-color: #d63353;
            transform: scale(1.05);
        }

        /* Mensaje Oculto */
        #hiddenMessage {
            display: none; /* Empieza oculto */
            margin-top: 20px;
            padding: 15px;
            background-color: #fff0f3;
            border-radius: 10px;
            border: 1px dashed #ff4d6d;
            animation: fadeIn 1s ease-out;
        }

        /* Fondo Interactivo */
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ffe6e6, #ffcccb);
            opacity: 0;
            transition: opacity 1s ease-out;
            z-index: -1;
        }

        .active-background {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="background" id="background"></div>

    <div class="card">
        <div class="heart">❤️</div>
        
        <h1>Holaaa, Antoo ❤️ </h1>

        <div class="photo-container">
            <img src="https://img.freepik.com/vector-gratis/linda-pareja-enamorada-ilustracion-icono-vector-dibujos-animados-corazon-concepto-icono-amor-personas-aislado_138676-5188.jpg" alt="Foto de nosotros">
        </div>

        <p>
            Quería hacer algo especial para decirte lo mucho que significas para mí.
            Eres mi persona favorita en el mundo.
        </p>

        <button onclick="mostrarAmor()">Tengo una sorpresa...</button>

        <div id="hiddenMessage">
            <h3>✨ Te amo ✨</h3>
            <p>"A tu lado, todo es mejor. Gracias por ser la persona que llena mi vida de amor y alegría."</p>
        </div>
    </div>

    <script>
        // Función para mostrar el mensaje secreto y hacer el fondo interactivo
        function mostrarAmor() {
            var mensaje = document.getElementById("hiddenMessage");
            var boton = document.querySelector("button");
            var background = document.getElementById("background");

            // Mostrar el mensaje
            mensaje.style.display = "block";
            // Ocultar el botón
            boton.style.display = "none"; 

            // Activar el fondo interactivo
            background.classList.add("active-background");

            // Reproducir un sonido de latido o amor (opcional)
            var audio = new Audio('https://www.soundjay.com/button/beep-07.wav'); // Puedes reemplazar por cualquier otro sonido
            audio.play();
        }
    </script>
</body>
</html>
